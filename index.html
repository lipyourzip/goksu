<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B. Göksu Çavuşoğlu</title>
<meta name="description" content="Academic Director, Turkish American Association (TAA), Ankara">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* Layout: a single centered card; name as the hero, round icon actions, one primary button */
:root {
  --ink: #14213d;
  --ink-soft: #5b6680;
  --paper: #ffffff;
  --bg: #e9edf4;
  --accent: #c8553d;
  --line: #e3e7ef;
  --display: "Fraunces", Georgia, serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 50% -200px, #d7deeb 0%, transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  display: grid;
  place-items: center;
  padding: 28px 16px;
}
.card {
  width: 100%;
  max-width: 380px;
  background: var(--paper);
  border-radius: 28px;
  padding: 40px 28px 28px;
  box-shadow: 0 30px 60px -30px rgba(20, 33, 61, .35), 0 2px 6px rgba(20, 33, 61, .05);
  position: relative;
  overflow: hidden;
  text-align: center;
}
.card::before {
  content: "";
  position: absolute; inset: 0 0 auto 0; height: 6px;
  background: linear-gradient(90deg, var(--ink) 0 70%, var(--accent) 70% 100%);
}
.eyebrow {
  margin: 0 0 14px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent);
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 34px;
  line-height: 1.08;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.org { margin: 14px 0 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
.place { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
.place i { font-size: 12px; margin-right: 5px; color: var(--accent); }
.rule { width: 40px; height: 1px; background: var(--line); margin: 26px auto; border: 0; }
.icons { display: flex; justify-content: center; gap: 14px; }
.icon {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 21px; color: #fff; text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 0 8px 18px -10px rgba(20, 33, 61, .6);
}
.icon:hover { transform: translateY(-2px); }
.icon:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.icon.phone, .icon.mail { background: var(--ink); }
.icon.wa { background: #25d366; font-size: 25px; }
.icon.li { background: #0a66c2; }
.save {
  margin-top: 26px; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 15px 18px; border: 0; border-radius: 14px;
  background: var(--ink); color: #fff;
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  text-decoration: none;
  transition: background .15s ease;
}
.save:hover { background: #22325a; }
.save:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.details { margin-top: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-soft); }
.details a { color: inherit; text-decoration: none; }
.details a:hover { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .icon, .save { transition: none; } }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">Academic Director</p>
  <h1>B. Göksu Çavuşoğlu</h1>
  <p class="org">Turkish American Association (TAA)</p>
  <p class="place"><i class="fa-solid fa-location-dot" aria-hidden="true"></i>Ankara, Türkiye</p>

  <hr class="rule">

  <nav class="icons" aria-label="Contact">
    <a class="icon phone" id="phoneLink" href="#" aria-label="Call"><i class="fa-solid fa-phone" aria-hidden="true"></i></a>
    <a class="icon mail" id="mailLink" href="#" aria-label="Email"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
    <a class="icon wa" id="waLink" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i></a>
    <a class="icon li" href="https://www.linkedin.com/in/goksucavusoglu/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
  </nav>

  <a class="save" id="saveBtn" href="#"><i class="fa-solid fa-user-plus" aria-hidden="true"></i>Save contact</a>

  <div class="details">
    <a id="phoneText" href="#"></a>
    <a id="mailText" href="#"></a>
  </div>
</main>

<script>
const PERSON = {
  first: "B. Göksu",
  last: "Çavuşoğlu",
  title: "Academic Director",
  org: "Turkish American Association (TAA)",
  city: "Ankara",
  country: "Türkiye",
  phone: "+90 535 391 49 69",
  email: "goksu@taa-ankara.org.tr",
  linkedin: "https://www.linkedin.com/in/goksucavusoglu/"
};
const tel = "tel:" + PERSON.phone.replace(/\s/g, "");
const mail = "mailto:" + PERSON.email;
document.getElementById("phoneLink").href = tel;
document.getElementById("mailLink").href = mail;
document.getElementById("phoneText").href = tel;
document.getElementById("phoneText").textContent = PERSON.phone;
document.getElementById("mailText").href = mail;
document.getElementById("mailText").textContent = PERSON.email;
document.getElementById("waLink").href = "https://wa.me/" + PERSON.phone.replace(/\D/g, "") +
  "?text=" + encodeURIComponent("Hi Göksu, nice to meet you! I'm ");

const vcard = [
  "BEGIN:VCARD", "VERSION:3.0",
  `N:${PERSON.last};Göksu;B.;;`,
  `FN:${PERSON.first} ${PERSON.last}`,
  `ORG:${PERSON.org}`,
  `TITLE:${PERSON.title}`,
  `TEL;TYPE=CELL:${PERSON.phone.replace(/\s/g, "")}`,
  `EMAIL;TYPE=WORK:${PERSON.email}`,
  `URL:${PERSON.linkedin}`,
  `ADR;TYPE=WORK:;;;${PERSON.city};;;${PERSON.country}`,
  "END:VCARD"
].join("\r\n");
const save = document.getElementById("saveBtn");
save.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard;charset=utf-8" }));
save.download = "Goksu-Cavusoglu.vcf";
</script>
</body>
</html>
