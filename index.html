<style>
/* Layout: a single centered card; name as the hero, round icon actions, one primary button */
:root {
  --ink: #14213d;
  --ink-soft: #5b6680;
  --paper: #ffffff;
  --bg: #e9edf4;
  --accent: #c8553d;
  --line: #e3e7ef;
  --display: "Fraunces", Georgia, serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 50% -200px, #d7deeb 0%, transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  display: grid;
  place-items: center;
  padding: 28px 16px;
}
.card {
  width: 100%;
  max-width: 380px;
  background: var(--paper);
  border-radius: 28px;
  padding: 40px 28px 28px;
  box-shadow: 0 30px 60px -30px rgba(20, 33, 61, .35), 0 2px 6px rgba(20, 33, 61, .05);
  position: relative;
  overflow: hidden;
  text-align: center;
}
.card::before {
  content: "";
  position: absolute; inset: 0 0 auto 0; height: 6px;
  background: linear-gradient(90deg, var(--ink) 0 70%, var(--accent) 70% 100%);
}
.eyebrow {
  margin: 14px 0 0;
  font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent);
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 34px;
  line-height: 1.08;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.org { margin: 6px 0 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
.place { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
.place i { font-size: 12px; margin-right: 5px; color: var(--accent); }
.rule { width: 40px; height: 1px; background: var(--line); margin: 26px auto; border: 0; }
.icons { display: flex; justify-content: center; gap: 14px; }
.icon {
  width: 56px; height: 56px; border-radius: 14px;
  display: grid; place-items: center;
  font-size: 21px; color: #fff; text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 0 8px 18px -10px rgba(20, 33, 61, .6);
}
.icon:hover { transform: translateY(-2px); }
.icon:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.icon.phone { background: linear-gradient(180deg, #5df27a 0%, #28c840 100%); font-size: 23px; }
.icon.mail { background: linear-gradient(180deg, #2fa4ff 0%, #1565f0 100%); font-size: 23px; }
.icon.wa { background: #25d366; font-size: 25px; }
.icon.li { background: #0a66c2; }
.save {
  margin-top: 26px; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 15px 18px; border: 0; border-radius: 14px;
  background: var(--ink); color: #fff;
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  text-decoration: none;
  transition: background .15s ease;
}
.save:hover { background: #22325a; }
.save:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.details { margin-top: 18px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-soft); }
.details a { color: inherit; text-decoration: none; }
.details a:hover { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .icon, .save { transition: none; } }
.share { margin-top: 26px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; display: grid; justify-items: center; gap: 12px; }
.share .code { width: 150px; height: 150px; }
.share .code svg { width: 100%; height: 100%; display: block; }
.share p { margin: 0; font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }
</style>
