<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Göksu Çavuşoğlu Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width card, identity on top, tap actions, contact QR at the bottom */
:root {
  --ink: #17233f;
  --ink-soft: #4a5672;
  --paper: #ffffff;
  --bg: #e7ebf3;
  --accent: #b8452f;
  --line: #d6dce8;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  min-height: 100%;
  display: grid;
  place-items: start center;
  padding: 32px 16px 48px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: var(--paper);
  border-radius: 20px;
  box-shadow: 0 18px 40px -20px rgba(23, 35, 63, .35);
  overflow: hidden;
}
.top {
  background: var(--ink);
  color: #fff;
  padding: 28px 24px 26px;
  display: grid;
  gap: 14px;
  position: relative;
}
.top::after {
  content: "";
  position: absolute; left: 24px; bottom: 0;
  width: 56px; height: 4px; background: var(--accent);
}
.mono {
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
  display: grid; place-items: center;
  font-family: var(--display); font-size: 24px; letter-spacing: .02em;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.1;
  text-wrap: balance;
}
.role { margin: 0; font-size: 15px; opacity: .9; line-height: 1.45; }
.role strong { font-weight: 600; display: block; }
.actions { display: grid; gap: 10px; padding: 22px 24px 8px; }
.btn {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink); text-decoration: none;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--ink-soft); background: #f6f8fc; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico {
  flex: none; width: 36px; height: 36px; border-radius: 9px;
  background: var(--bg); display: grid; place-items: center; color: var(--ink);
}
.ico svg { width: 18px; height: 18px; }
.lbl { display: grid; gap: 1px; min-width: 0; }
.lbl small { font-size: 12px; color: var(--ink-soft); }
.lbl span { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.qr {
  margin: 14px 24px 24px;
  padding: 18px;
  border-radius: 14px;
  background: var(--bg);
  display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
}
#qrcode { background: #fff; padding: 8px; border-radius: 8px; line-height: 0; }
#qrcode img, #qrcode canvas { width: 112px !important; height: 112px !important; }
.qr p { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
.qr p strong { color: var(--ink); display: block; font-size: 14.5px; margin-bottom: 2px; }
.copy {
  margin-top: 10px; font: inherit; font-size: 13px; font-weight: 600;
  background: var(--ink); color: #fff; border: 0; border-radius: 8px;
  padding: 7px 12px; cursor: pointer;
}
.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 360px) { .qr { grid-template-columns: 1fr; justify-items: start; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <div class="mono" aria-hidden="true">GÇ</div>
    <h1>B. Göksu Çavuşoğlu</h1>
    <p class="role"><strong>Academic Director</strong>Turkish American Association (TAD) · Çankaya, Ankara</p>
  </header>

  <nav class="actions" aria-label="Contact">
    <a class="btn" id="phoneLink" href="#">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
      <span class="lbl"><small>Phone</small><span id="phoneText"></span></span>
    </a>
    <a class="btn" id="mailLink" href="#">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
      <span class="lbl"><small>Email</small><span id="mailText"></span></span>
    </a>
    <a class="btn" href="https://www.linkedin.com/in/goksucavusoglu/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zM9.5 9.75h3.8v1.5h.06c.53-1 1.83-2.06 3.77-2.06 4.030 0 4.77 2.65 4.77 6.1v5.46h-4v-4.84c0-1.16-.02-2.64-1.6-2.64-1.62 0-1.86 1.26-1.86 2.56v4.92h-4z"/></svg></span>
      <span class="lbl"><small>LinkedIn</small><span>linkedin.com/in/goksucavusoglu</span></span>
    </a>
  </nav>

  <section class="qr" aria-label="Save contact">
    <div id="qrcode" role="img" aria-label="QR code with contact details"></div>
    <div>
      <p><strong>Save contact</strong>Scan with your phone camera to add this contact straight to your address book.</p>
      <button class="copy" id="copyBtn" type="button">Copy details</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// === Edit details here ===
const PERSON = {
  first: "B. Göksu",
  last: "Çavuşoğlu",
  title: "Academic Director",
  org: "Turkish American Association (TAD)",
  city: "Ankara",
  phone: "+90 535 391 59 69",
  email: "goksu@taa-ankara.org.tr",
  linkedin: "https://www.linkedin.com/in/goksucavusoglu/"
};

document.getElementById("phoneText").textContent = PERSON.phone;
document.getElementById("phoneLink").href = "tel:" + PERSON.phone.replace(/\s/g, "");
document.getElementById("mailText").textContent = PERSON.email;
document.getElementById("mailLink").href = "mailto:" + PERSON.email;

const vcard = [
  "BEGIN:VCARD", "VERSION:3.0",
  `N:${PERSON.last};Göksu;B.;;`,
  `FN:${PERSON.first} ${PERSON.last}`,
  `ORG:${PERSON.org}`,
  `TITLE:${PERSON.title}`,
  `TEL;TYPE=CELL:${PERSON.phone.replace(/\s/g, "")}`,
  `EMAIL:${PERSON.email}`,
  `URL:${PERSON.linkedin}`,
  `ADR;TYPE=WORK:;;;${PERSON.city};;;Turkey`,
  "END:VCARD"
].join("\n");

try {
  new QRCode(document.getElementById("qrcode"), {
    text: unescape(encodeURIComponent(vcard)),
    width: 224, height: 224,
    colorDark: "#17233f", colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
} catch (e) {
  document.getElementById("qrcode").textContent = "QR code could not load";
}

const copyBtn = document.getElementById("copyBtn");
copyBtn.addEventListener("click", async () => {
  const text = `${PERSON.first} ${PERSON.last}\n${PERSON.title}, ${PERSON.org}\n${PERSON.phone}\n${PERSON.email}\n${PERSON.linkedin}`;
  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = "Copied";
  } catch (e) {
    copyBtn.textContent = "Could not copy";
  }
  setTimeout(() => { copyBtn.textContent = "Copy details"; }, 1800);
});
</script>
</body>
</html>
